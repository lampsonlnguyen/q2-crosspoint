name: CrossPoint Core CI

on:
  push:
    branches: [main, crosspod-renderer-linux-link, crosspod-original-chapter-engine]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: crosspoint-core-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test (GCC and Clang)
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - compiler: gcc
            cxx: g++
          - compiler: clang
            cxx: clang++
    steps:
      - uses: actions/checkout@v4

      - name: Install host XML dependency
        run: sudo apt-get update && sudo apt-get install -y libexpat1-dev zlib1g-dev libjpeg-dev

      - name: Configure CrossPoint core
        run: cmake -S crosspoint-core -B build/crosspoint-core -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_COMPILER=${{ matrix.cxx }}

      - name: Build
        run: cmake --build build/crosspoint-core --parallel 2

      - name: Test
        run: ctest --test-dir build/crosspoint-core --output-on-failure

      - name: Diagnose upstream engine crash
        if: failure()
        run: |
          sudo apt-get install -y gdb
          gdb --batch -ex "set pagination off" -ex run -ex "bt 30" \
            --args build/crosspoint-core/crosspoint_original_engine_link_tests \
            build/crosspoint-core/multilingual.epub

      - name: Convert EPUB preview to PNG
        if: matrix.compiler == 'gcc'
        run: |
          python3 crosspoint-core/tools/pgm_to_png.py build/crosspoint-core/crosspod-epub-preview.pgm build/crosspoint-core/crosspod-epub-preview.png
          sha256sum build/crosspoint-core/crosspod-epub-preview.{pgm,png}

      - name: Render Vietnamese book sample to PNG
        if: matrix.compiler == 'gcc'
        run: |
          python3 crosspoint-core/tools/pgm_to_png.py build/crosspoint-core/crosspod-vietnamese-preview.pgm build/crosspoint-core/crosspod-vietnamese-preview.png
          sha256sum build/crosspoint-core/crosspod-vietnamese-preview.{pgm,png}

      - name: Upload rendered EPUB page
        if: matrix.compiler == 'gcc'
        uses: actions/upload-artifact@v4
        with:
          name: crosspod-epub-page-preview-${{ github.sha }}
          path: |
            build/crosspoint-core/crosspod-epub-preview.pgm
            build/crosspoint-core/crosspod-epub-preview.png
            build/crosspoint-core/crosspod-vietnamese-preview.pgm
            build/crosspoint-core/crosspod-vietnamese-preview.png
          if-no-files-found: error
          retention-days: 30

      - name: Package tested host components
        if: matrix.compiler == 'gcc'
        run: |
          set -euo pipefail
          mkdir -p dist/core-devkit/lib dist/core-devkit/include dist/core-devkit/platform
          cp build/crosspoint-core/libcrosspoint_utf8.a build/crosspoint-core/libcrosspoint_txt.a build/crosspoint-core/libcrosspoint_epub_container.a build/crosspoint-core/libcrosspoint_zip.a build/crosspoint-core/libcrosspoint_opf.a build/crosspoint-core/libcrosspoint_book_cache.a build/crosspoint-core/libcrosspod_q2_input.a build/crosspoint-core/libcrosspod_q2_framebuffer.a build/crosspoint-core/libcrosspoint_layout_foundation.a build/crosspoint-core/libcrosspoint_font_metrics.a build/crosspoint-core/libcrosspoint_linebreak.a dist/core-devkit/lib/
          cp crosspoint-core/lib/Utf8/Utf8.h crosspoint-core/lib/Txt/TxtToHtml.h crosspoint-core/lib/Epub/parsers/ContainerParser.h crosspoint-core/lib/ZipFile/ZipFile.h crosspoint-core/lib/Epub/parsers/ContentOpfParser.h crosspoint-core/lib/Epub/Epub/BookMetadataCache.h crosspoint-core/lib/Serialization/BufferedFile.h crosspoint-core/lib/Serialization/Serialization.h crosspoint-core/lib/Epub/css/CssParser.h crosspoint-core/lib/Epub/css/CssStyle.h crosspoint-core/lib/Epub/WordStore.h crosspoint-core/lib/EpdFont/EpdFont.h crosspoint-core/lib/EpdFont/EpdFontData.h crosspoint-core/lib/EpdFont/EpdFontFamily.h crosspoint-core/lib/Epub/CjkBreaks.h crosspoint-core/lib/Epub/TokenBoundary.h crosspoint-core/lib/Epub/hyphenation/HyphenationCommon.h dist/core-devkit/include/
          cp crosspoint-core/platform/q2/Q2Controls.hpp crosspoint-core/platform/q2/Q2Display.hpp crosspoint-core/platform/q2/Q2BookHandoff.hpp crosspoint-core/platform/q2/Q2SocketInput.hpp crosspoint-core/platform/q2/Q2Framebuffer.hpp crosspoint-core/platform/q2/Q2PagePresenter.hpp dist/core-devkit/platform/
          cp crosspoint-core/LICENSE-CROSSPOINT crosspoint-core/LICENSE-BORROWED-CODE dist/core-devkit/
          cp -R crosspoint-core/platform/posix dist/core-devkit/posix
          cp build/crosspoint-core/crosspod-epub-check dist/core-devkit/
          printf '%s\n' 'DEVELOPMENT CORE ONLY — Linux x86_64 host static libraries, NOT Q2 firmware.' > dist/core-devkit/NOT-FLASHABLE.txt
          cd dist
          zip -qr crosspod-crosspoint-core-devkit.zip core-devkit

      - name: Upload development build
        if: matrix.compiler == 'gcc'
        uses: actions/upload-artifact@v4
        with:
          name: crosspod-crosspoint-core-devkit-${{ github.sha }}
          path: dist/crosspod-crosspoint-core-devkit.zip
          if-no-files-found: error
          retention-days: 30
